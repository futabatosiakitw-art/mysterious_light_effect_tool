<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>謎の光ツール</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 全体のスクロールを禁止 */
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 55px;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .privacy-badge {
            font-size: 0.8rem;
            background-color: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 0.3rem 0.7rem;
            border-radius: 9999px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 55px);
            overflow: hidden;
        }

        /* ワークスペース (プレビュー) */
        .workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            /* チェック柄の背景 */
            background-image: 
                linear-gradient(45deg, var(--panel-border) 25%, transparent 25%), 
                linear-gradient(-45deg, var(--panel-border) 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, var(--panel-border) 75%), 
                linear-gradient(-45deg, transparent 75%, var(--panel-border) 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #111827;
            position: relative;
            overflow: hidden;
            padding: 1rem;
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
            max-width: 100%;
            max-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 画像のサイズに合わせてコンテナもリサイズされるようにする */
            line-height: 0; 
        }

        canvas {
            display: block;
            /* CSSでサイズを固定せず、親コンテナに合わせる */
            max-width: 100%;
            max-height: calc(100vh - 90px); /* ヘッダーとパディング分を引く */
            width: auto;
            height: auto;
            object-fit: contain;
            cursor: crosshair;
            /* 画像の背景を白にする（透過PNG対策） */
            background-color: white;
        }

        /* ドラッグドロップオーバーレイ */
        .dropzone-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 4px dashed var(--accent);
            margin: 1rem;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 20;
        }

        .dropzone-overlay.dragover {
            background-color: rgba(30, 41, 59, 0.95);
            border-color: #60a5fa;
            transform: scale(1.02);
        }

        .dropzone-overlay h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            pointer-events: none;
        }

        .dropzone-overlay p {
            color: var(--text-sub);
            font-size: 1rem;
            pointer-events: none;
        }

        /* コントロールパネル */
        .control-panel {
            width: 350px;
            min-width: 350px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
            font-size: 0.9rem;
        }

        .panel-section {
            padding: 1rem;
            border-bottom: 1px solid var(--panel-border);
        }

        .panel-section h3 {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* レイヤーリスト */
        .layer-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 0.75rem;
            padding-right: 5px;
        }

        .layer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem 0.6rem;
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--panel-border);
            border-radius: 0.3rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .layer-item:hover {
            border-color: var(--text-sub);
            background-color: rgba(30, 41, 59, 0.8);
        }

        .layer-item.active {
            border-color: var(--accent);
            background-color: rgba(59, 130, 246, 0.15);
        }

        .layer-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            font-weight: 500;
            pointer-events: none;
        }

        .layer-actions {
            display: flex;
            gap: 0.25rem;
            margin-left: 0.5rem;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            padding: 0.15rem;
            border-radius: 0.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .icon-btn:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.1);
        }

        .icon-btn.delete:hover {
            color: var(--danger);
            background-color: rgba(239, 68, 68, 0.15);
        }

        /* フォームコントロール */
        .control-group {
            margin-bottom: 0.75rem;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 0.25rem;
        }

        .control-inputs {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
            cursor: pointer;
            height: 5px;
        }

        input[type="number"] {
            width: 60px;
            background-color: var(--bg-color);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 0.15rem 0.4rem;
            border-radius: 0.3rem;
            font-size: 0.85rem;
            text-align: right;
            appearance: textfield; /* スピンボタンを非表示にする（webkit以外） */
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            opacity: 1; /* スピンボタンを表示する（webkit） */
            height: 1.5rem;
        }

        select, input[type="color"] {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 0.4rem;
            border-radius: 0.3rem;
            font-size: 0.9rem;
        }

        select {
            cursor: pointer;
            appearance: menulist;
        }

        input[type="color"] {
            height: 32px;
            cursor: pointer;
            padding: 0.15rem;
            border: 1px solid var(--panel-border);
        }

        /* ボタン */
        .btn {
            width: 100%;
            padding: 0.6rem;
            border: none;
            border-radius: 0.3rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
            line-height: 1.2;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--text-sub);
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background-color: rgba(239, 68, 68, 0.25);
            border-color: var(--danger);
        }

        .disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        /* スクロールバー装飾 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--panel-border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-sub);
        }

        /* ツールチップ */
        [title] {
            position: relative;
        }
    </style>
</head>
<body>

    <header>
        <h1>謎の光ツール</h1>
        <div class="privacy-badge">🔒 完全ローカル処理（外部送信なし）</div>
    </header>

    <div class="main-container">
        <!-- ワークスペース -->
        <div class="workspace" id="workspace">
            <div class="dropzone-overlay" id="dropzone">
                <h2>ここに画像をドロップ</h2>
                <p>または クリックして画像を選択</p>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
            </div>

            <div class="canvas-container">
                <canvas id="canvas"></canvas>
            </div>
        </div>

        <!-- コントロールパネル -->
        <div class="control-panel">
            <!-- 画像管理 -->
            <div class="panel-section">
                <h3>ベース画像</h3>
                <button class="btn btn-secondary" id="changeImageBtn" style="margin-bottom: 0.5rem;">画像を変更する</button>
                <button class="btn btn-danger" id="resetAllBtn">すべてリセット</button>
            </div>

            <!-- 光レイヤー管理 -->
            <div class="panel-section">
                <h3>
                    <span>光レイヤー</span>
                    <span id="layerCount" style="font-size: 0.8rem; color: var(--text-sub);">0個</span>
                </h3>
                <div class="layer-list" id="layerList">
                    <!-- 動的に追加 -->
                </div>
                <button class="btn btn-primary" id="addLightBtn">+ 光を追加</button>
            </div>

            <!-- 選択中の光プロパティ -->
            <div class="panel-section" id="propertiesPanel">
                <h3>光の設定</h3>
                
                <div class="control-group">
                    <label class="control-label">種類</label>
                    <select id="lightType">
                        <option value="white-glow">白光バー (発光グラデーション)</option>
                        <option value="black-bar">黒帯 (シークレットバー)</option>
                        <option value="mosaic">モザイク風ぼかし</option>
                        <option value="solid-color">ベタ塗り帯</option>
                    </select>
                </div>

                <div class="control-group" id="colorGroup">
                    <label class="control-label">光の色</label>
                    <input type="color" id="lightColor" value="#ffffff">
                </div>

                <div class="control-group">
                    <label class="control-label"><span>位置 X (%)</span></label>
                    <div class="control-inputs">
                        <input type="range" id="posXRange" min="-150" max="150" step="1" value="0">
                        <input type="
